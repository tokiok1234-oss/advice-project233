<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advertising Inquiry | Partner with Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="theme-toggle">
        <button id="theme-btn">Switch to Dark Mode</button>
    </div>
    <main>
        <header class="site-header">
            <h1>Advertising Inquiry</h1>
            <p>Grow your business with us. Submit your inquiry below and our team will get back to you shortly.</p>
        </header>

        <section class="inquiry-section">
            <form action="https://formspree.io/f/mjgayqpw" method="POST" id="inquiry-form">
                <div class="form-group">
                    <label for="company">Company Name</label>
                    <input type="text" name="company" id="company" placeholder="Your Company Name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" name="email" id="email" placeholder="email@example.com" required>
                </div>
                <div class="form-group">
                    <label for="subject">Inquiry Type</label>
                    <select name="subject" id="subject" required>
                        <option value="" disabled selected>Select an option</option>
                        <option value="Display Ad">Display Advertising</option>
                        <option value="Sponsorship">Sponsorship</option>
                        <option value="Content Partnership">Content Partnership</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="message">Details</label>
                    <textarea name="message" id="message" placeholder="Please describe your advertising goals..." required></textarea>
                </div>
                <button type="submit" id="submit-btn">Send Advertising Inquiry</button>
            </form>
        </section>

        <section class="comments-section">
            <div id="disqus_thread"></div>
            <script>
                /**
                *  RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS.
                *  LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables    */

                var disqus_config = function () {
                this.page.url = PAGE_URL;  // Replace PAGE_URL with your page's canonical URL variable
                this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable
                };
                */
                (function() { // DON'T EDIT BELOW THIS LINE
                var d = document, s = d.createElement('script');
                s.src = 'https://advice-11.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());
                (d.head || d.body).appendChild(s);
                })();
            </script>
            <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
        </section>

        <footer class="site-footer">
            <p>&copy; 2026 Advertising Solutions. All rights reserved.</p>
        </footer>
    </main>
    <script src="main.js"></script>
</body>
</html>
