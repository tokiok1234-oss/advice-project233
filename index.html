<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="theme-toggle">
        <button id="theme-btn">Switch to Dark Mode</button>
    </div>
    <main>
        <h1>Lotto Number Generator</h1>
        <div id="lotto-numbers" class="lotto-container"></div>
        <button id="generate-btn">Generate Numbers</button>

        <section class="inquiry-section">
            <hr>
            <h3>Affiliate Inquiry</h3>
            <form action="https://formspree.io/f/mjgayqpw" method="POST" id="inquiry-form">
                <div class="form-group">
                    <input type="email" name="email" placeholder="Your Email Address" required>
                </div>
                <div class="form-group">
                    <textarea name="message" placeholder="How can we help you?" required></textarea>
                </div>
                <button type="submit" id="submit-btn">Send Inquiry</button>
            </form>
        </section>
    </main>
    <script src="main.js"></script>
</body>
</html>
